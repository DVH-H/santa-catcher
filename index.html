<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Julemandens Grabber</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #06101f;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: system-ui, sans-serif;
    color: #fff;
  }
  #frame {
    position: absolute;
    left: 0;
    top: 0;
    width: 360px;
    height: 640px;
    transform-origin: 0 0;
  }
  #game {
    width: 360px;
    height: 640px;
    display: block;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(6, 16, 31, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  h1 { margin: 0; font-size: 28px; }
  h2 { margin: 0; font-size: 30px; }
  p { margin: 0; font-size: 14px; opacity: 0.9; }
  .big-score { font-size: 44px; font-weight: 800; color: #ffe27a; }
  .small { font-size: 13px; opacity: 0.8; }
  input {
    font-size: 18px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 0;
    width: 200px;
    text-align: center;
    -webkit-user-select: text;
    user-select: text;
  }
  button {
    font-size: 22px;
    font-weight: 700;
    padding: 12px 40px;
    border-radius: 12px;
    border: 0;
    background: #d8342c;
    color: #fff;
  }
  .legend { width: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .combo { display: flex; align-items: center; gap: 8px; font-size: 12px; text-align: left; }
  .combo-icons { flex: 0 0 120px; display: flex; align-items: center; justify-content: flex-end; font-size: 18px; }
  .combo-text { flex: 1; }
  .icon img { width: 22px; height: 22px; object-fit: contain; vertical-align: middle; }
  .arrow { margin: 0 3px; font-size: 12px; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="game"></canvas>
  <div id="overlay"></div>
</div>
<script src="game.js"></script>
</body>
</html>
