<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Julemandens Grabber</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #06101f;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: system-ui, sans-serif;
    color: #fff;
  }
  #frame {
    position: absolute;
    left: 0;
    top: 0;
    width: 360px;
    height: 640px;
    transform-origin: 0 0;
  }
  #game {
    width: 360px;
    height: 640px;
    display: block;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(6, 16, 31, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  h1 { margin: 0; font-size: 28px; }
  h2 { margin: 0; font-size: 30px; }
  p { margin: 0; font-size: 14px; opacity: 0.9; }
  .big-score { font-size: 44px; font-weight: 800; color: #ffe27a; }
  .small { font-size: 13px; opacity: 0.8; }
  input {
    font-size: 18px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 0;
    width: 200px;
    text-align: center;
    -webkit-user-select: text;
    user-select: text;
  }
  button {
    font-size: 22px;
    font-weight: 700;
    padding: 12px 40px;
    border-radius: 12px;
    border: 0;
    background: #d8342c;
    color: #fff;
  }
  h3 { margin: 6px 0 0; font-size: 18px; color: #ffe27a; }
  .icon img { width: 24px; height: 24px; object-fit: contain; vertical-align: middle; }
  .icon.big { font-size: 28px; }
  .arrow { margin: 0 3px; font-size: 12px; }
  .items {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px 6px;
    width: 100%;
    margin: 6px 0;
  }
  .item-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 22px; }
  .item-cell .icon img { width: 36px; height: 36px; }
  .item-cell span:last-child { font-size: 15px; font-weight: 700; }
  .good { color: #7dffa0; }
  .bad { color: #ff6b6b; }
  .cards { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .card {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid #3a6bb5;
    background: #12305a;
    color: #fff;
    font-size: 14px;
    font-weight: 400;
    text-align: left;
  }
  .card:active { background: #1d4a86; }
  .card-icons { flex: 0 0 96px; display: flex; align-items: center; justify-content: center; }
  .card-title { font-weight: 700; font-size: 15px; }
  .card-text { font-size: 13px; opacity: 0.9; margin-top: 2px; }
  .tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 6px;
    background: #d8342c;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="game"></canvas>
  <div id="overlay"></div>
</div>
<script src="game.js"></script>
</body>
</html>
